<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>轉盤抽獎系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎡 轉盤抽獎系統</h1>
        <div class="main-content">
            <div class="left-panel">
                <h3>獎品列表</h3>
                <textarea id="prizes">大獎\n二獎\n三獎</textarea>
                <h3>抽獎者列表</h3>
                <textarea id="participants">小明\n小華\n小紅</textarea>
                <div class="buttons">
                    <button onclick="spin()">開始抽獎</button>
                </div>
                <div id="result-display">
                    <strong>得獎結果：</strong><span id="winner-text">尚未抽獎</span>
                </div>
            </div>
            <div class="right-panel">
                <div id="wheel-container">
                    <div id="pointer">▼</div>
                    <canvas id="wheelCanvas" width="400" height="400"></canvas>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
